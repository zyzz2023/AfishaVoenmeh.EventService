services:
    postgres:	
        image: postgres:16
        container_name: EventService-PostgresContainer
        restart: always
        ports:
            - "5434:5432"
        volumes:
            - eventService_postgresData:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
    eventService_postgresData: