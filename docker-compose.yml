services:
    postgres:	
        image: postgres:16
        container_name: EventService-PostgresContainer
        restart: unless-stopped
        ports:
            - "5434:5432"
        volumes:
            - eventService_postgresData:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    redis:
      image: redis:7-alpine
      container_name: EventService-RedisContainer
      restart: unless-stopped
      command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_USER_PASSWORD}"]
      ports:
        - "6379:6379"     
      environment:
        - REDIS_PASSWORD=${REDIS_USER_PASSWORD} 
      volumes:
        - redis-data:/data

volumes:
    eventService_postgresData:
    redis-data: